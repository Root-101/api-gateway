name: CI

on:
  pull_request:
  push:
    branches: [ develop, master ]
  # release.yml runs it before publishing the images
  workflow_call:

# a new push to the same branch or PR replaces the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # unit + integration tests (Testcontainers uses the docker of the runner) + coverage gate + AOT
      # gradlew is not executable in git
      - run: chmod +x gradlew && ./gradlew check jacocoTestReport processAot
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            gateway/build/reports/tests
            gateway/build/reports/jacoco

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # warnings fail the job, infos don't
      - run: flutter analyze --no-fatal-infos
      - run: flutter build web --release

  native-image:
    # slow (native compile), but it catches what the JVM tests can't see: every PR, once the tests pass
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t api-gateway gateway
      # smoke test of the native binary: catches GraalVM reflection problems the JVM tests can't see
      - name: Smoke test
        run: |
          set -eu
          docker network create gw
          docker run -d --name db --network gw -e POSTGRES_DB=api-gateway -e POSTGRES_PASSWORD=smoke postgres:16
          until docker exec db pg_isready -U postgres -d api-gateway; do sleep 1; done
          docker run -d --name gw --network gw -p 8080:8080 -e DB_HOST=db -e DB_PASSWORD=smoke api-gateway
          for i in $(seq 60); do curl -sf localhost:8080/_admin/health && break || sleep 1; done
          AUTH="admin:admin123**"
          curl -sf -X POST localhost:8080/_admin/auth/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123**"}'
          # a route to the gateway itself: /self/health → /_admin/health
          curl -sf -u "$AUTH" -X POST localhost:8080/_admin/routes -H 'Content-Type: application/json' \
            -d '{"name":"self","path":"/self/**","uri":"http://localhost:8080","rewrite_path":{"replace_from":"/self/(?<segment>.*)","replace_to":"/_admin/${segment}"}}'
          curl -sf -u "$AUTH" localhost:8080/_admin/routes | grep -q '"name":"self"'
          curl -sf localhost:8080/self/health | grep -q UP
          sleep 3
          curl -sf -u "$AUTH" -X POST localhost:8080/_admin/http-log/search -H 'Content-Type: application/json' -d '{"page":0,"size":10}' | grep -q '/self/health'
      # contract of the admin API for external clients: the documented collection, with its assertions, against the native image
      - name: Postman collection
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          postman collection run docs/postman/Api-Gateway.postman_collection.json -e "docs/postman/Api-Gateway - Local.postman_environment.json" --no-report-events
      # a route the gateway can't build still answers 200 to the api, it only shows up here
      - name: No route build errors in the log
        if: always()
        run: "! docker logs gw 2>&1 | grep -A5 'Refresh routes error'"
      - name: Gateway logs
        if: always()
        run: docker logs gw || true
