name: console
description: "Front-End for Api-Gateway project"
publish_to: 'none'

version: 6.1.2

environment:
  flutter: ^3.50.0
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  #material widgets, out of the flutter sdk since 3.47 (material.dart is deprecated)
  material_ui: 1.11.1

  #state management & dependency injection
  flutter_bloc: 9.1.1
  get: 4.7.3

  #routing
  go_router: 18.1.4

  #rest client
  dio: 5.11.1

  #view
  flutter_animate: 4.5.2
  gap: 3.1.0    #sizebox with auto with and height in columns and rows
  flutter_svg: 2.5.0    #to show icons in svg format
  flutter_dropzone: 4.2.1       #for drop files in restore routes
  flutter_secure_storage: 11.2.0       #for the remember-me in login

  #utils
  logger: 2.8.0
  intl: 0.20.3
  #texts generated from lib/i18n/*.i18n.yaml (`fvm dart run slang`)
  slang: 4.19.2
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

  #app config
  flutter_native_splash: 2.4.8
  flutter_launcher_icons: 0.14.4

#configuration of splash screen, if something change, run: `fvm flutter pub run flutter_native_splash:create`
flutter_native_splash:
  color: "#121019"
  web: true

#configuration of flutter_icons, if something change, run: `fvm flutter pub run flutter_launcher_icons`
flutter_icons:
  web:
    generate: true
    image_path: "assets/app/app_icon.png"
    background_color: "#121019"
    theme_color: "#121019"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/app/
  fonts:
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono/DMMono-Medium.ttf
          weight: 500
    - family: DMSans
      #only the weights the console uses, no italics
      fonts:
        - asset: assets/fonts/DMSans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans/DMSans-Bold.ttf
          weight: 700
