# Generates lib/i18n/strings.g.dart from the YAML files (run `fvm dart run slang` from console/).
# The generated code is versioned. No LocaleSettings / global state from slang: the app keeps the
# current language in LanguageCubit and reads the texts through `app.intl` (lib/i18n/i18n.dart).
base_locale: en
# A key missing in a non-base locale is a compile error in the generated code.
fallback_strategy: none
input_directory: lib/i18n
input_file_pattern: .i18n.yaml
# `{value}` like ARB/ICU instead of the default `$value`
string_interpolation: braces
output_directory: lib/i18n
output_file_name: strings.g.dart
flutter_integration: false
locale_handling: false
translation_class_visibility: public
lazy: false
enum_name: AppLocale
class_name: AppTexts
timestamp: false
statistics: false
format:
  enabled: true
