info:
  what: '¿Qué es {name}?'
  healthTitle: '¿Está arriba el servicio?'
  healthBody: 'El gateway llama cada cierto tiempo a una ruta del servicio, como /health. Una respuesta 2xx marca la ruta LIVE; cualquier otra, o ninguna, la marca DOWN.'
  healthNote: 'Solo vigila: las peticiones siguen llegando al servicio igual. Para cortarlas, activa el mantenimiento. Comprobar ahora lo hace al momento.'
  maintenanceTitle: 'Ciérrala un rato'
  maintenanceBody: 'Mientras está activo, el gateway responde a cada petición de esta ruta con un 503 y tu mensaje, sin llamar al servicio.'
  maintenanceBodyGateway: 'Mientras está activo, el gateway responde a cada petición, en todas las rutas, con un 503 y tu mensaje, sin llamar a ningún servicio.'
  maintenanceNote: 'Puedes indicar una hora de vuelta para los clientes. Al apagarlo, las peticiones vuelven a pasar.'
  rateTitle: 'Cuántas peticiones por cliente'
  rateBody: 'Cada IP de cliente tiene un número de peticiones por segundo, minuto u hora. El burst es cuántas pueden llegar a la vez.'
  rateBodyGateway: 'Cada IP de cliente tiene un número de peticiones por segundo, minuto u hora, sumando todas las rutas. El burst es cuántas pueden llegar a la vez.'
  rateNote: 'Al pasarse, el gateway responde 429 sin llamar al servicio. Cualquier cambio reinicia los contadores.'
  corsTitle: 'Qué webs pueden llamarla'
  corsBody: 'Una página de otro origen solo puede leer las respuestas de esta ruta si su origen está en la lista. Permite credenciales si el servicio usa cookies.'
  corsBodyGateway: 'Una página de otro origen solo puede llamar al gateway si su origen está en la lista. Cubre la API admin (esta consola) y todas las rutas sin CORS propio.'
  corsNote: 'Solo los navegadores aplican CORS: curl, Postman y los servidores no se ven afectados. El gateway responde él mismo a los preflights.'
