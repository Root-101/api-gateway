info:
  what: 'What is {name: String}?'
  healthTitle: 'Is the service up?'
  healthBody: 'The gateway calls a path of the service, like /health, on a schedule. A 2xx answer marks the route LIVE; any other answer, or none, marks it DOWN.'
  healthNote: 'It only watches: requests keep going to the service either way. To stop them, turn on maintenance. Run now checks it right away.'
  maintenanceTitle: 'Close it for a while'
  maintenanceBody: 'While it is on, the gateway answers every request to this route with a 503 and your message, and doesn''t call the service.'
  maintenanceBodyGateway: 'While it is on, the gateway answers every request, on every route, with a 503 and your message, and doesn''t call any service.'
  maintenanceNote: 'You can add a return time for the clients. Turn it off and requests go through again.'
  rateTitle: 'How many requests per client'
  rateBody: 'Each client IP gets a number of requests per second, minute or hour. Burst is how many can arrive at once.'
  rateBodyGateway: 'Each client IP gets a number of requests per second, minute or hour, on all routes together. Burst is how many can arrive at once.'
  rateNote: 'Past the limit the gateway answers 429 and doesn''t call the service. Any change resets the counts.'
  corsTitle: 'Which websites may call it'
  corsBody: 'A web page on another origin can only read this route''s answers if its origin is listed. Allow credentials when the service uses cookies.'
  corsBodyGateway: 'A web page on another origin can only call the gateway if its origin is listed. It covers the admin API (this console) and every route without its own CORS.'
  corsNote: 'Only browsers apply CORS: curl, Postman and servers aren''t affected. The gateway answers the preflights itself.'
