server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # flutter web file names are not content-hashed (main.dart.js, assets/), so always revalidate (ETag -> 304) to avoid stale code after a deploy
    add_header Cache-Control "no-cache" always;

    # connect-src is open because the gateway url only exists at runtime (env.js); gstatic serves CanvasKit and fallback fonts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src *; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # health check for docker and load balancers: without it every path answers 200 with index.html
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"up"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
