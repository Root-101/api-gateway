plugins {
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.11.3'
    id 'jacoco'
}

group = 'dev.root101'

version = '5.0.1'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

dependencies {
    //base api-gateway dependency (versions from the spring cloud BOM)
    implementation 'org.springframework.cloud:spring-cloud-gateway-server-webflux'
    implementation 'org.springframework.cloud:spring-cloud-loadbalancer'

    //security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    //health check
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    //DB
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.postgresql:r2dbc-postgresql:1.1.1.RELEASE'

    //lombok: autogenerate getters, setters....
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    //custom exceptions, validations & more
    implementation 'dev.root101.commons:commons:5.5.2'

    //flyway
    implementation 'org.flywaydb:flyway-core:11.12.0'
    implementation 'org.flywaydb:flyway-database-postgresql:11.12.0'
    implementation 'org.postgresql:postgresql:42.7.10'

    //tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'io.projectreactor:reactor-test'
}

dependencyManagement {
    imports {
        //release train aligned with spring boot 3.5 (gateway 4.3.4, loadbalancer 4.3.2)
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.2'
    }
}

//`test`: fast unit tests. `integrationTest`: `*IT` classes (Spring context + Testcontainers, Docker required)
test {
    useJUnitPlatform()
    exclude '**/*IT.class'
}

tasks.register('integrationTest', Test) {
    description = 'Integration tests (*IT), needs Docker'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    shouldRunAfter test
}

//coverage of unit + integration tests together
jacocoTestReport {
    executionData fileTree(layout.buildDirectory).include('jacoco/*.exec')
    dependsOn test, integrationTest
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    executionData fileTree(layout.buildDirectory).include('jacoco/*.exec')
    dependsOn test, integrationTest
    violationRules {
        rule {
            //a bit under the current coverage (95% lines / 90% branches), so it can only go up
            limit {
                counter = 'LINE'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn integrationTest, jacocoTestCoverageVerification
jacocoTestReport.mustRunAfter integrationTest

//test AOT boots the context at build time, before testcontainers starts the db. Only needed for `nativeTest` (not used)
tasks.named('processTestAot') {
    enabled = false
}

application {
    mainClass = 'dev.root101.api_gateway.App'
}

graalvmNative {
    binaries {
        main {
            imageName = 'graalvm'
            mainClass = 'dev.root101.api_gateway.App'
        }
    }
}