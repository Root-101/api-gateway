services:
  # -------------------
  # POSTGRES DATABASE
  # -------------------
  postgres:
    image: postgres:16
    container_name: api_gateway_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: api-gateway-local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: a123b456**
    ports:
      - "127.0.0.1:5432:5432"    #local only: the gateway reaches it on the compose network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-d", "api-gateway-local" ]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - api_network

  # -------------------
  # JAVA API GATEWAY
  # -------------------
  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: api-gateway-service
    container_name: api_gateway_service
    depends_on:
      postgres:
        condition: service_healthy    #the gateway runs the migrations on start: the db must accept connections
    environment:
      PROFILE: LOCAL
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123**
      ADMIN_PATH: _admin
      APPLICATION_NAME: Api-Gateway
      PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: api-gateway-local
      DB_USERNAME: postgres
      DB_PASSWORD: a123b456**

      MAINTAIN_LOGS_FOR_DAYS: 14
      MAX_LOGS_SEARCH_SIZE: 10000

      ADMIN_MAX_FAILED_ATTEMPTS: 10
      ADMIN_LOCKOUT_MINUTES: 15
      ADMIN_TOKEN_MINUTES: 480
      CORS_ALLOWED_ORIGINS: "*"

      GATEWAY_CONNECT_TIMEOUT_MS: 10000
      GATEWAY_RESPONSE_TIMEOUT: 60s
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - api_network

  # -------------------
  # FLUTTER WEB (NGINX)
  # -------------------
  flutter-web:
    build:
      context: ./console
      dockerfile: Dockerfile
    image: flutter-web-service
    container_name: api_gateway_web_ui
    environment:
      GATEWAY_SERVICE_URL: "http://localhost:8080"
      ADMIN_PATH: "_admin"
    depends_on:
      - api-gateway
    ports:
      - "127.0.0.1:80:80"
    networks:
      - api_network

# -------------------
# VOLUMES
# -------------------
volumes:
  postgres_data:

# -------------------
# NETWORKS
# -------------------
networks:
  api_network:
    driver: bridge
