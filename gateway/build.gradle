plugins {
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'application'
    id 'org.graalvm.buildtools.native' version '1.1.18'
    id 'jacoco'
}

group = 'dev.root101'

version = '6.0.0'

repositories {
    mavenCentral()
}

java {
    //gradle picks (or detects) a JDK 25 for compile/tests/AOT, no matter the JDK running gradle
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    //base api-gateway dependency (versions from the spring cloud BOM)
    implementation 'org.springframework.cloud:spring-cloud-gateway-server-webflux'

    //security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'


    //DB
    //versions of the libraries managed by spring boot come from its BOM
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.postgresql:r2dbc-postgresql'

    //lombok: autogenerate getters, setters....
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    //custom exceptions, validations & more
    implementation 'dev.root101.commons:commons:5.5.3'

    //flyway (spring boot 4: the auto-configuration lives in its own starter)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql'

    //tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webtestclient'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'io.projectreactor:reactor-test'
    //gradle 9 no longer adds the junit launcher by itself
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        //release train aligned with spring boot 4.0/4.1 (gateway 5.0.4)
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.4'
    }
}

//`test`: fast unit tests. `integrationTest`: `*IT` classes (Spring context + Testcontainers, Docker required)
test {
    useJUnitPlatform()
    exclude '**/*IT.class'
}

tasks.register('integrationTest', Test) {
    description = 'Integration tests (*IT), needs Docker'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    shouldRunAfter test
}

//coverage of unit + integration tests together
jacocoTestReport {
    executionData fileTree(layout.buildDirectory).include('jacoco/*.exec')
    dependsOn test, integrationTest
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    executionData fileTree(layout.buildDirectory).include('jacoco/*.exec')
    dependsOn test, integrationTest
    violationRules {
        rule {
            //a bit under the current coverage (95% lines / 90% branches), so it can only go up
            limit {
                counter = 'LINE'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn integrationTest, jacocoTestCoverageVerification
jacocoTestReport.mustRunAfter integrationTest

//test AOT boots the context at build time, before testcontainers starts the db. Only needed for `nativeTest` (not used)
tasks.named('processTestAot') {
    enabled = false
}

application {
    mainClass = 'dev.root101.api_gateway.App'
}

graalvmNative {
    binaries {
        main {
            imageName = 'graalvm'
            mainClass = 'dev.root101.api_gateway.App'
            // Netty's TLS client allocates with Arena.ofShared (FFM); without this every HTTPS upstream fails
            buildArgs.add('-H:+SharedArenaSupport')
        }
    }
}