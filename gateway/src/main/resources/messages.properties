error.auth.wrong-credentials=Wrong username or password
error.auth.invalid-basic=Invalid Basic credentials
error.unauthorized=Authentication required
error.forbidden=Not allowed
error.auth.locked=Too many failed attempts, try again in {0}

# ---- Errors ----
error.validation=The request has invalid fields
error.conflict=Conflict with existing data
error.no-route=No route matches {0}
validation.invalid-value=Invalid value for {0}
