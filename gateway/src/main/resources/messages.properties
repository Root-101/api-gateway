error.unreadable-request=The request can't be read
error.upstream.timeout=The service didn't answer in time
error.upstream.connect-timeout=The service didn't connect in time
error.upstream.unreachable=The service can't be reached
error.upstream.closed=The service closed the connection
error.internal-server-error=Internal server error
error.maintenance.active=The service is under maintenance, try again later
error.maintenance.gateway-not-found=The gateway has no maintenance configured
