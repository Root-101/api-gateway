error.rate-limit.gateway-not-found=The gateway has no rate limit configured
error.rate-limit.route-not-found=The route has no rate limit configured: {0}
error.cors.invalid-origin=Must be * or an origin like https://app.com or https://*.example.com, without a path
error.cors.route-not-found=The route has no CORS configured: {0}
