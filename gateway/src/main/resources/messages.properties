# Every text the admin API answers with, in English (the default). Spanish: messages_es.properties.
# A message with arguments ({0}) goes through MessageFormat: a single quote there is written twice ('').

# ---- Bean validation (the 422 violations) ----
jakarta.validation.constraints.NotBlank.message=Must not be blank
jakarta.validation.constraints.NotNull.message=Must not be null
jakarta.validation.constraints.Size.message=Size must be between {min} and {max}
jakarta.validation.constraints.Min.message=Must be {value} or more
jakarta.validation.constraints.Max.message=Must be {value} or less
org.hibernate.validator.constraints.URL.message=Must be a valid URL

# ---- Routes ----
error.route.invalid-path=Must be a valid path pattern
