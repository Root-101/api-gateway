error.route.name-taken=Route already exists: {0}
error.route.duplicated-name=Duplicated route: {0}
error.route.invalid-id=Route id must be a UUID: {0}
error.route.not-found=Route does not exist: {0}

# ---- HTTP logs search ----
error.http-log.invalid-status=status must be a number
error.http-log.invalid-route-id=route_id must be a uuid or NO-ROUTE
error.http-log.invalid-page=page must be 0 or more
error.http-log.invalid-size=size must be 1 or more

